<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LivroCerto — Qual livro ler agora?</title>
<meta name="description" content="Assistente virtual que recomenda o seu próximo livro.">
<style>
:root{--bg:#0a0a0c;--panel:#131316;--card:#1a1a1f;--card2:#212128;--line:#2b2b33;--ink:#f4f2ea;--mute:#9b9aa8;--y:#f7c61a;--y2:#e5b100;--yink:#171200;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
h1,h3{font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif}
header{border-bottom:1px solid var(--line);background:#101013;padding:16px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
.top{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:28px;height:28px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em;font-weight:800;color:var(--y)}
.badge{font-size:.72rem;font-weight:800;padding:3px 11px;border-radius:99px;background:#f7c61a1f;border:1px solid #f7c61a40;color:var(--y)}
.tag{flex-basis:100%;margin:0;color:var(--mute);font-size:.95rem}
nav{margin-left:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:99px}
nav button{border:0;background:none;color:var(--mute);padding:7px 18px;border-radius:99px;font:inherit;font-size:.9rem;font-weight:800;cursor:pointer}
nav button[aria-selected=true]{background:linear-gradient(135deg,var(--y),var(--y2));color:var(--yink)}
main{flex:1;min-height:0;width:100%;max-width:1040px;margin:14px auto 0;display:flex;flex-direction:column;padding:0 12px 12px}
section{display:none;flex:1;min-height:0;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden}
section.on{display:flex}
#feed,#catalogo{flex:1;overflow-y:auto;padding:18px}
.row{display:flex;gap:10px;margin:0 0 18px;align-items:flex-start}
.row.user{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--y),var(--y2));display:grid;place-items:center;font-size:1rem}
.body{flex:1;min-width:0}
.row.user .txt{max-width:80%}
.txt{display:inline-block;background:var(--card);border:1px solid var(--line);padding:10px 15px;border-radius:6px 20px 20px 20px;white-space:pre-wrap;word-wrap:break-word}
.user .txt{background:linear-gradient(135deg,var(--y),var(--y2));color:var(--yink);border:0;border-radius:20px 6px 20px 20px;font-weight:800}
.cards,.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cards{margin-top:12px}
.cards.n1{grid-template-columns:minmax(210px,300px)}
.cards.n2{grid-template-columns:repeat(2,minmax(210px,300px))}
.book{--c1:hsl(var(--h) 70% 48%);--c2:hsl(calc(var(--h) + 40) 75% 28%);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s,border-color .15s}
.book:hover{transform:translateY(-3px);border-color:hsl(var(--h) 60% 50%)}
.book.top{border-color:var(--y);box-shadow:0 0 0 1px var(--y),0 8px 28px #f7c61a1f}
.capa{position:relative;height:104px;display:grid;place-items:center;font-size:2.9rem;background:radial-gradient(circle at 80% 15%,#ffffff30,#0000 45%),linear-gradient(150deg,var(--c1),var(--c2))}
.capa::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:#00000040}
.rank{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:99px;background:#000000a6;color:#fff;backdrop-filter:blur(4px)}
.top .rank{background:var(--y);color:var(--yink)}
.corpo{display:flex;flex-direction:column;gap:6px;padding:13px 14px 14px;flex:1}
.book h3{margin:2px 0 0;font-size:1.08rem;line-height:1.2}
.by{color:var(--mute);font-size:.84rem;margin-top:-4px}
.sin{margin:0;font-size:.86rem;color:#d6d4cc;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:99px;background:hsl(var(--h) 55% 20%);color:hsl(var(--h) 90% 76%)}
.pill.n{background:var(--card2);color:var(--mute);font-weight:700}
.why{padding-top:8px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--mute)}
.why .pill{background:#f7c61a1a;color:var(--y);font-weight:700}
.rod{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:9px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute)}
.nota{font-weight:800;font-size:.95rem;color:var(--y)}
.link{width:100%;background:none;border:1.5px solid #f7c61a66;color:var(--y);padding:7px;border-radius:12px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer}
.link:hover{background:var(--y);color:var(--yink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.chips button{border:1px solid #f7c61a40;background:#f7c61a14;color:var(--y);padding:6px 13px;border-radius:99px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
.chips button:hover{background:#f7c61a2e}
form{display:flex;gap:8px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 16px}
form input{flex:1;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
form button{border:0;background:linear-gradient(135deg,var(--y),var(--y2));color:var(--yink);font:inherit;font-weight:800;padding:0 24px;border-radius:14px;cursor:pointer}
form button:disabled{opacity:.5}
.filtros{display:flex;gap:8px;padding:16px 18px 0;flex-wrap:wrap}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--y);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}.book{transition:none}}
@media(max-width:560px){.cards,.cards.n1,.cards.n2,.grid{grid-template-columns:1fr}.capa{height:84px;font-size:2.3rem}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="7" width="15" height="15" rx="3" fill="#f7c61a"/><rect x="10" y="3" width="15" height="15" rx="3" fill="#e5b100" opacity=".9"/></svg>
    <h1>LivroCerto</h1>
    <span class="badge" id="modo">…</span>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="chat">Conversa</button>
      <button role="tab" aria-selected="false" data-tab="cat">Catálogo</button>
    </nav>
    <p class="tag">Sem ideia do que ler? Descreva o clima e eu acho o livro.</p>
  </div>
</header>
<main>
  <section id="chat" class="on">
    <div id="feed" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <input id="msg" autocomplete="off" maxlength="500" placeholder="Ex.: algo leve de fantasia com aventura" aria-label="Descreva o livro que procura">
      <button id="enviar">Enviar</button>
    </form>
  </section>
  <section id="cat">
    <div class="filtros">
      <select id="fg" aria-label="Gênero"><option value="">Todos os gêneros</option></select>
      <select id="fn" aria-label="Nível"><option value="">Todos os níveis</option></select>
    </div>
    <div id="catalogo"><div class="grid" id="grid"></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const feed = $('#feed'), historico = [];
const esc = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

// gênero -> [matiz da capa, emoji, nome exibido]
const G = {
  'Fantasia':[265,'🐉'], 'Terror':[350,'👻'], 'Romance':[330,'💌'], 'Suspense':[200,'🕵️'],
  'Ficcao cientifica':[185,'🚀','Ficção científica'], 'Negocios':[38,'💼','Negócios'],
  'Desenvolvimento pessoal':[150,'🌱'], 'Historia':[22,'🏛️','História'], 'Distopia':[285,'🏙️'],
  'Classico':[48,'📜','Clássico'], 'Classico brasileiro':[125,'🌴','Clássico brasileiro'],
  'Drama':[310,'🎭'], 'Drama historico':[12,'⏳','Drama histórico'], 'Ficcao':[225,'📖','Ficção'], 'Biografia':[95,'🧭']
};
const gi = g => G[g] || [(g.length * 47) % 360, '📚'];
const gNome = g => gi(g)[2] || g;
const NIVEL = {iniciante:'Iniciante', intermediario:'Intermediário', avancado:'Avançado'};
const tempo = t => t.replace('medio','Médio').replace('curto','Curto').replace('longo','Longo').replace('paginas','páginas');

// pos: posição no ranking (só no chat); undefined no catálogo
function cardHTML(l, pos) {
  const [h, emoji] = gi(l.genero);
  const chat = pos !== undefined;
  const rank = chat ? (pos === 0 ? '★ Melhor match' : `${pos + 1}ª opção`) : '';
  return `<article class="book${pos === 0 ? ' top' : ''}" style="--h:${h}">
    <div class="capa" aria-hidden="true">${emoji}${rank ? `<span class="rank">${rank}</span>` : ''}</div>
    <div class="corpo">
      <div class="pills"><span class="pill">${esc(gNome(l.genero))}</span><span class="pill n">${NIVEL[l.nivel] || esc(l.nivel)}</span></div>
      <h3>${esc(l.titulo)}</h3>
      <div class="by">${esc(l.autor)}</div>
      <p class="sin">${esc(l.sinopse)}</p>
      ${chat && l.motivos?.length ? `<div class="why pills">Combina por: ${l.motivos.map(m => `<span class="pill">${esc(m)}</span>`).join('')}</div>` : ''}
      <div class="rod">
        <div class="meta"><span class="nota">★ ${l.avaliacao}</span><span>${esc(tempo(l.tempo_leitura))}</span></div>
        <button class="link" data-similar="${l.id}">Quero algo parecido</button>
      </div>
    </div></article>`;
}

function addMsg(papel, html, livros) {
  const d = document.createElement('div');
  d.className = 'row ' + papel;
  d.innerHTML = papel === 'user'
    ? `<div class="txt">${html}</div>`
    : `<div class="av" aria-hidden="true">📖</div><div class="body"><div class="txt">${html}</div>` +
      (livros?.length ? `<div class="cards n${livros.length}">${livros.map((l, i) => cardHTML(l, i)).join('')}</div>` : '') + '</div>';
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}

async function enviar(exibir, consulta = exibir, excluir = null) {
  addMsg('user', esc(exibir));
  const espera = addMsg('bot', '<span class="dots"><span></span><span></span><span></span></span>');
  $('#enviar').disabled = true;
  try {
    const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mensagem: consulta, historico, excluir_id: excluir})});
    if (!r.ok) throw new Error();
    const d = await r.json();
    espera.remove();
    addMsg('bot', rich(d.texto), d.livros);
    historico.push(consulta);
  } catch {
    espera.remove();
    addMsg('bot', 'Não consegui falar com o servidor. Confira se o python src/server.py está rodando e tente de novo.');
  }
  $('#enviar').disabled = false;
  $('#msg').focus();
}

$('#form').onsubmit = e => {
  e.preventDefault();
  const t = $('#msg').value.trim();
  if (!t) return;
  $('#msg').value = '';
  enviar(t);
};

let catalogo = [];
document.body.addEventListener('click', e => {
  const b = e.target.closest('[data-similar]');
  const l = b && catalogo.find(x => x.id == b.dataset.similar);
  if (!l) return;
  mostrar('chat');
  enviar(`Algo parecido com ${l.titulo}`, `${l.genero} ${l.tags.slice(0, 3).join(' ')}`, l.id);
});

function mostrar(aba) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === aba));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === aba));
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => mostrar(b.dataset.tab));

async function carregarCatalogo() {
  const q = new URLSearchParams({genero: $('#fg').value, nivel: $('#fn').value});
  const d = await (await fetch('/api/livros?' + q)).json();
  catalogo = d.livros;
  $('#grid').innerHTML = d.livros.map(l => cardHTML(l)).join('') || '<p>Nenhum livro com esses filtros.</p>';
  if ($('#fg').options.length === 1) {
    d.generos.forEach(g => $('#fg').add(new Option(gNome(g), g)));
    d.niveis.forEach(n => $('#fn').add(new Option(NIVEL[n] || n, n)));
  }
}
$('#fg').onchange = $('#fn').onchange = carregarCatalogo;

['Fantasia leve com aventura', 'Suspense psicológico com reviravoltas', 'Algo curto para iniciantes',
 'Um clássico romântico', 'Terror para ler à noite'].forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = t; b.onclick = () => enviar(t);
  $('#chips').appendChild(b);
});

fetch('/api/status').then(r => r.json()).then(s => {
  $('#modo').textContent = (s.modo === 'ia' ? 'IA generativa' : 'Modo local') + ' • ' + s.total_livros + ' livros';
}).catch(() => $('#modo').textContent = 'offline');
carregarCatalogo();
addMsg('bot', 'Oi! Eu sou o <strong>LivroCerto</strong> 👋\nMe conte o que você quer ler — gênero, clima, tamanho ou nível — e eu indico até 3 livros.');
</script>
</body>
</html>
